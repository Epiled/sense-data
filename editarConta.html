<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/css/global/reset.css" />
    <link rel="stylesheet" href="./src/css/global/base.css" />

    <link rel="stylesheet" href="./src/css/components/container.css" />
    <link rel="stylesheet" href="./src/css/components/form.css" />
  </head>

  <body class="container">
    <main class="container__main">
      <div class="form">
        <h1 class="form__title">Editar Conta</h1>

        <form class="form__container" data-form>
          <div class="form__fields">
            <fieldset class="form__wrap">
              <input
                class="form__input"
                type="text"
                name="category"
                id="category"
                data-category
              />
              <label class="form__label" for="category" required minlength="3"
                >Categoria:
              </label>
              <span class="form__error" data-message-error></span>
            </fieldset>

            <fieldset class="form__wrap">
              <input
                class="form__input"
                type="date"
                name="date"
                id="date"
                data-date
              />
              <label class="form__label" for="date">Data: </label>
              <span class="form__error" data-message-error></span>
            </fieldset>

            <fieldset class="form__wrap">
              <input
                class="form__input"
                type="text"
                name="description"
                id="description"
                data-description
              />
              <label class="form__label" for="description" minlength="3"
                >Descricao:
              </label>
              <span class="form__error" data-message-error></span>
            </fieldset>

            <fieldset class="form__wrap">
              <input
                class="form__input"
                type="text"
                name="amount"
                id="amount"
                data-amount
              />
              <label class="form__label" for="amount" minlength="3"
                >Valor:
              </label>
              <span class="form__error" data-message-error></span>
            </fieldset>

            <input
              class="form__input"
              type="hidden"
              id="account"
              name="account"
              data-account
            />

            <button class="form__button" type="submit">Atualizar</button>
          </div>
        </form>
      </div>
    </main>

    <script>
      let account = document.querySelector("#account");
      const user = JSON.parse(localStorage.getItem("userLogado"));
      account.value = user.accountId;
    </script>

    <script type="module" src="./src/app/editCard.js"></script>
    <script src="./src/js/inputFeedback.js"></script>
  </body>
</html>
