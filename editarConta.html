<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/base.css" />
    <link rel="stylesheet" href="./src/css/container.css" />
    <link rel="stylesheet" href="./src/css/form.css" />
  </head>

  <body class="container">
    <main class="container__princiapl">
      <div class="form">
        <h1 class="form__title">Editar Conta</h1>

        <form class="form__container" data-form>
          <div class="form__fields">
            <fieldset class="form__wrap">
              <input
                class="form__input"
                type="text"
                name="categoria"
                id="categoria"
                data-categoria
              />
              <label class="form__label" for="categoria" required minlength="3"
                >Categoria:
              </label>
              <span class="form__error" data-mensagem-erro></span>
            </fieldset>

            <fieldset class="form__wrap">
              <input
                class="form__input"
                type="date"
                name="data"
                id="data"
                data-data
              />
              <label class="form__label" for="data">Data: </label>
              <span class="form__error" data-mensagem-erro></span>
            </fieldset>

            <fieldset class="form__wrap">
              <input
                class="form__input"
                type="text"
                name="descricao"
                id="descricao"
                data-descricao
              />
              <label class="form__label" for="descricao" minlength="3"
                >Descricao:
              </label>
              <span class="form__error" data-mensagem-erro></span>
            </fieldset>

            <fieldset class="form__wrap">
              <input
                class="form__input"
                type="text"
                name="valor"
                id="valor"
                data-valor
              />
              <label class="form__label" for="valor" minlength="3"
                >Valor:
              </label>
              <span class="form__error" data-mensagem-erro></span>
            </fieldset>

            <input
              class="form__input"
              type="hidden"
              id="conta"
              name="conta"
              data-conta
            />

            <button class="form__button" type="submit">Atualizar</button>
          </div>
        </form>
      </div>
    </main>

    <script>
      let conta = document.querySelector("#conta");
      const contaLogada = JSON.parse(localStorage.getItem("userLogado"));
      conta.value = contaLogada.idGastos;
    </script>

    <script type="module" src="./src/app/editarCard.js"></script>
    <script src="./src/js/iptEffect.js"></script>
  </body>
</html>
