  <body class="container dashboard">
    <header class="header">
      <div class="header__top">
        <span class="header__user">Felipe</span>
        <div class="header__functions">
          <div class="header__search">
            <input
              class="header__input"
              type="search"
              placeholder="Busqe por Categoria"
            />
            <button class="header__button">Buscar</button>
          </div>
          <a
            class="header__button header__button--add"
            href="adicionarConta.html"
            >Adicionar Conta</a
          >
        </div>
      </div>

      <div class="filter">
        <header class="filter__header">
          <h2 class="filter__text">filters:</h2>
        </header>
        <div class="filter__types">
          <div class="filter__type">
            <fieldset class="filter__set">
              <label class="filter__category" for="ipt-categories">
                Categorias:
              </label>
              <select
                class="filter__categories"
                data-filter-categories
                name="ipt-categories"
                id="ipt-categories"
              >
                <option value="Todos" selected>Todos</option>
                <option value="Saúde">Saúde</option>
                <option value="Lazer">Lazer</option>
                <option value="Transporte">Transporte</option>
              </select>
            </fieldset>
          </div>

          <div class="filter__type">
            <fieldset class="filter__set">
              <label class="filter__category" for="categorias"> Valor: </label>
              <label class="filter__label" for="ipt-min">
                Min:
                <input
                  class="filter__input"
                  id="ipt-min"
                  data-filter-min
                  type="text"
                />
              </label>
              <label class="filter__label" for="ipt-max">
                Max:
                <input
                  class="filter__input"
                  id="ipt-max"
                  data-filter-max
                  type="text"
                />
              </label>
            </fieldset>
            <button class="filter__button" data-btn-filter-amount>
              Filtar
            </button>
          </div>

          <div class="filter__type">
            <fieldset class="filter__set">
              <label class="filter__category"> Ordenação: </label>

              <fieldset class="filter__set">
                <label class="filter__label" for="ipt-type"> Tipo: </label>
                <select
                  class="filter__categories"
                  data-filter-type
                  name="ipt-type"
                  id="ipt-type"
                >
                  <option value="" disabled selected></option>
                  <option value="Categoria">Categoria</option>
                  <option value="Valores">Valores</option>
                </select>
              </fieldset>

              <fieldset class="filter__set">
                <label class="filter__label" for="ordem"> Ordem: </label>
                <select
                  class="filter__categories"
                  data-filter-order
                  name="order"
                  id="order"
                >
                  <option value="" disabled selected></option>
                  <option value="Crescente">Crescente</option>
                  <option value="Decrescente">Decrescente</option>
                </select>
              </fieldset>
            </fieldset>
          </div>
        </div>
      </div>
