<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/css/globalreset.css" />
    <link rel="stylesheet" href="./src/css/globalbase.css" />

    <link rel="stylesheet" href="./src/css/components/container.css" />
    <link rel="stylesheet" href="./src/css/components/form.css" />
  </head>

  <body class="container">
    <main class="container__main">
      <div class="form">
        <h1 class="form__title">Já tem Cadastro</h1>

        <form class="form__container" data-form action="" method="get">
          <div class="form__fields">
            <fieldset class="form__wrap">
              <input
                class="form__input"
                value="marica@contato.com"
                data-field
                type="email"
                name="iptEmail"
                id="iptEmail"
                minlength="3"
                required
              />
              <label class="form__label" for="iptEmail">Usuário: </label>
              <span class="form__error" data-message-error></span>
            </fieldset>

            <fieldset class="form__wrap">
              <input
                class="form__input"
                value="senhaMarcia"
                data-field
                type="text"
                name="iptPassword"
                id="iptPassword"
                minlength="8"
                required
              />
              <label class="form__label" for="iptPassword">Senha: </label>
              <span class="form__error" data-message-error></span>
            </fieldset>

            <span class="form__error" data-message-error-login></span>
            <button class="form__button" type="submit">Login</button>
          </div>
        </form>
      </div>
    </main>
    <script src="./src/js/login.js" type="module"></script>
    <script src="./src/js/inputFeedback.js"></script>
  </body>
</html>
